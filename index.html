<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>정보보호 업무 실무편람 2026</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="chatgpt-layout">
    <!-- 1. 좌측 사이드바 (ChatGPT Left Sidebar 그대로 재현) -->
    <aside class="chatgpt-sidebar" aria-label="사이드바 메뉴">
      <div class="sidebar-header">
        <button class="icon-btn" onclick="toggleSidebar()" title="사이드바 닫기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18"/>
          </svg>
        </button>
        <button class="icon-btn" onclick="resetStreamToHome()" title="새 안내 화면 (초기화)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
        </button>
      </div>

      <div class="sidebar-scroll" id="sidebar-menu-list"></div>

      <div class="sidebar-footer">
        <button class="user-profile-btn" onclick="openSchoolModal()" title="내 학교 및 담당자 설정">
          <span class="avatar-circle" id="sidebar-avatar">전</span>
          <div style="overflow:hidden;">
            <div id="sidebar-school" style="font-size:0.83rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">전남○○학교</div>
            <div id="sidebar-manager" style="font-size:0.72rem; color:var(--text-muted);">정보부장 교사 홍길동</div>
          </div>
        </button>
        <button class="icon-btn" onclick="toggleTheme()" title="라이트/다크 테마 전환">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </button>
      </div>
    </aside>

    <!-- 2. 중앙 대화형 스트림 영역 (하단 채팅 입력창 없이 클릭형 대화 스트림으로 동작) -->
    <main class="chat-main">
      <header class="chat-topbar">
        <div style="display:flex; align-items:center; gap:8px;">
          <button class="icon-btn" onclick="toggleSidebar()" title="사이드바 열기/닫기">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M3 12h18M3 6h18M3 18h18"/>
            </svg>
          </button>
          <button class="model-selector-btn" onclick="resetStreamToHome()">
            <span>정보보호 실무편람</span>
            <span class="model-Selector-sub">2026 Edition</span>
          </button>
        </div>

        <div style="display:flex; align-items:center; gap:8px;">
          <button class="chip-btn" onclick="openSchoolModal()">학교 정보 설정</button>
          <button class="chip-btn" onclick="resetStreamToHome()">대화 초기화</button>
        </div>
      </header>

      <div class="chat-scroll-area" id="chat-scroll-area">
        <div class="chat-container">
          <!-- 상단 웰컴 & 주제 선택기 -->
          <div id="welcome-section"></div>
          <!-- 클릭한 주제들이 ChatGPT 답변처럼 쌓이는 대화 스트림 -->
          <div id="conversation-stream" class="conversation-stream"></div>
        </div>
      </div>
    </main>

    <!-- 3. 우측 분할 ChatGPT Canvas 문서 창 (서식·기안문·대장·슬라이드 열람 및 편집) -->
    <aside class="chatgpt-canvas-pane" id="canvas-pane" aria-label="Canvas 문서 편집기">
      <div class="canvas-header">
        <div class="canvas-title-wrap">
          <span class="badge" id="canvas-badge">Canvas</span>
          <span id="canvas-title">문서 미리보기</span>
        </div>
        <div style="display:flex; align-items:center; gap:6px;">
          <button class="chip-btn" onclick="openSchoolModal()">학교 설정</button>
          <button class="chip-btn" onclick="window.print()">인쇄</button>
          <button class="icon-btn" onclick="closeCanvas()" title="Canvas 닫기">✕</button>
        </div>
      </div>
      <div class="canvas-body" id="canvas-body"></div>
    </aside>
  </div>

  <!-- 학교 기본 정보 설정 모달 -->
  <div id="school-modal" class="modal-backdrop">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <h3 style="font-size:1.05rem; font-weight:600;">학교 및 담당자 설정</h3>
        <button class="chip-btn" onclick="closeSchoolModal()">닫기</button>
      </div>
      <p style="font-size:0.82rem; color:var(--text-secondary);">입력된 학교·담당자 정보는 우측 Canvas에 열리는 모든 기안문과 대장에 자동 기입됩니다.</p>
      <form onsubmit="saveSchoolInfoForm(event)">
        <div class="form-grid">
          <div class="form-group">
            <label for="inp-schoolName">학교명</label>
            <input id="inp-schoolName" type="text" required />
          </div>
          <div class="form-group">
            <label for="inp-eduOfficeName">관할 교육지원청</label>
            <input id="inp-eduOfficeName" type="text" required />
          </div>
          <div class="form-group">
            <label for="inp-principalName">교장 성명 (CPO)</label>
            <input id="inp-principalName" type="text" />
          </div>
          <div class="form-group">
            <label for="inp-vicePrincipalName">교감 성명</label>
            <input id="inp-vicePrincipalName" type="text" />
          </div>
          <div class="form-group">
            <label for="inp-adminHeadName">행정실장 성명</label>
            <input id="inp-adminHeadName" type="text" />
          </div>
          <div class="form-group">
            <label for="inp-managerRole">담당자 직위</label>
            <input id="inp-managerRole" type="text" />
          </div>
          <div class="form-group">
            <label for="inp-managerName">담당자 성명</label>
            <input id="inp-managerName" type="text" />
          </div>
          <div class="form-group">
            <label for="inp-masterId">기관마스터 ID</label>
            <input id="inp-masterId" type="text" />
          </div>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:14px;">
          <button type="button" class="chip-btn" onclick="closeSchoolModal()">취소</button>
          <button type="submit" class="chip-btn primary">저장</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
